[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smatrix-bootstrap-reproduction"
version = "0.1.0"
description = "Scientific reproduction of pion S-matrix and gauge theory bootstrap"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.15", "python-flint==0.9.0", "highspy>=1.10", "clarabel>=0.11", "scs>=3.2.11", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8", "mpmath>=1.3"]
sdp = ["cvxpy>=1.9,<2", "Mosek==11.2.4", "mpmath>=1.3"]

[project.scripts]
smatrix-bootstrap = "smatrix_bootstrap.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
